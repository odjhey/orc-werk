[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orc-werk"
version = "0.3.0"
description = "Opinionated, contract-driven orchestration kernel for autonomous work delivery"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/odjhey/orc-werk"
Documentation = "https://github.com/odjhey/orc-werk/tree/master/docs"

[project.scripts]
orc = "orc_werk.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# TASK-M3D-001 `orc onboard`: the orc-ledger skill's single authored
# copy lives at src/orc_werk/skills/orc-ledger/SKILL.md; this ships it
# with the installed package so `onboard` copies it from the installed
# package, never a second hand-maintained copy embedded in Python
# source. `.agents/skills/orc-ledger/SKILL.md` is a relative symlink to
# this exact file (see src/orc_werk/skills/__init__.py's docstring).
"orc_werk.skills" = ["orc-ledger/SKILL.md", "orc-ledger/CHANGELOG.md"]
