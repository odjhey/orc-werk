[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orc-werk"
version = "0.9.0"
description = "Opinionated, contract-driven orchestration kernel for autonomous work delivery"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/odjhey/orc-werk"
Documentation = "https://github.com/odjhey/orc-werk/tree/master/docs"

[project.scripts]
orc = "orc_werk.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# TASK-M3D-001 `orc onboard`: the orc-ledger skill's single authored
# copy lives at src/orc_werk/skills/orc-ledger/SKILL.md; this ships it
# with the installed package so `onboard` copies it from the installed
# package, never a second hand-maintained copy embedded in Python
# source. `.agents/skills/orc-ledger/SKILL.md` is a relative symlink to
# this exact file (see src/orc_werk/skills/__init__.py's docstring).
"orc_werk.skills" = ["orc-ledger/SKILL.md", "orc-ledger/CHANGELOG.md"]

# TASK-M5-007 `orc onboard --omp`: the .omp/ scaffold templates' single
# authored copy lives under src/orc_werk/omp_scaffold/; this ships them
# with the installed package so `onboard` copies them from the installed
# package, never a second hand-maintained copy embedded in Python source
# (see src/orc_werk/omp_scaffold/__init__.py's docstring for why these
# are a deliberately independent copy of this repo's own .omp/, not a
# symlink to it).
"orc_werk.omp_scaffold" = ["RULES.md", "config.yml", "agents/*.md"]
